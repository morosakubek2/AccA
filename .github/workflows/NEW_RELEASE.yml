name: Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate temporary signing key
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create key.properties
        run: |
          cat > key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=release-key.jks
          EOF

      - name: Build release APK
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: assembleRelease

      - name: Sign APK if unsigned
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Found APK: $APK"
          if [[ "$APK" == *"-unsigned.apk" ]]; then
            echo "APK is unsigned, signing manually..."
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
            $APKSIGNER sign --ks release-key.jks --ks-key-alias androiddebugkey \
              --ks-pass pass:android --key-pass pass:android \
              --v1-signing-enabled --v2-signing-enabled --verbose "$APK"
            # Zipalign
            ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -r | head -n 1)
            $ZIPALIGN -v -p 4 "$APK" "${APK%.apk}-aligned.apk"
            mv "${APK%.apk}-aligned.apk" "$APK"
            # Rename to remove -unsigned if present
            mv "$APK" "${APK/-unsigned.apk/.apk}"
            APK="${APK/-unsigned.apk/.apk}"
            echo "Signed and renamed to: $APK"
          else
            echo "APK is already signed."
          fi

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          echo "Verifying: $APK"
          $APKSIGNER verify --verbose "$APK" || exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
          body: "Automatycznie podpisany release APK"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
