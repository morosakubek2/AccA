name: Releases

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  pull_request:

permissions:
  id-token: write
  contents: write

jobs:
  linux:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17
          check-latest: true

      - name: Setup Buildtools
        uses: buildtool/setup-buildtools-action@v1.0.0

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1.5.0
        with:
          ndk-version: r26d

      - name: Temporarily disable signing in build.gradle
        run: |
          # To build unsigned APK, comment out signingConfig in release buildType
          sed -i 's/signingConfig signingConfigs.release/#signingConfig signingConfigs.release/' app/build.gradle
          # Also comment out the loading of key.properties if present
          sed -i 's/if (keystorePropertiesFile.exists()) {/if (false) {/' app/build.gradle  # Adjust if your code differs

      - name: Gradle Build (unsigned)
        uses: gradle/gradle-build-action@v2
        with:
          arguments: assembleRelease
          gradle-home-cache-cleanup: true

      - name: Generate keystore automatically
        run: |
          # Generate a new keystore each run (note: this creates a new key every time - fine for testing, but for Play Store use fixed key)
          keytool -genkey -v -keystore release-key.jks -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" -storetype JKS

      - name: Sign APK
        run: |
          # Find the latest apksigner
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          # The unsigned APK is app-release.apk when signing is disabled
          UNSIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          # Sign it to a temp file
          $APKSIGNER sign --ks release-key.jks --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --v1-signing-enabled --v2-signing-enabled "$UNSIGNED_APK"
          # Optionally zipalign for optimization (if needed)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -r | head -n 1)
          $ZIPALIGN -v -p 4 "$UNSIGNED_APK" app-release-signed.apk
          # Overwrite the original with the signed/aligned version
          mv app-release-signed.apk "$UNSIGNED_APK"

      - name: Upload APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          path: app/build/outputs/apk/release/*.apk
          name: apk

      - name: Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          body: Bump Version
          files: |
            app/build/outputs/apk/release/*.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.FORBD }}
