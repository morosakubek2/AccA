name: Releases
on:
  push:
    tags:
      - '*'
  workflow_dispatch:
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Generate temporary signing key
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US"
            
      - name: Create key.properties
        run: |
          cat > key.properties << EOF
          storePassword=android
          keyPassword=android
          keyAlias=androiddebugkey
          storeFile=../release-key.jks
          EOF
          
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
        
      - name: Sign and align APK
        run: |
          # Znajdź narzędzia
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          ZIPALIGN=$(find $ANDROID_SDK_ROOT/build-tools -name zipalign | sort -r | head -n 1)
          
          # Znajdź APK
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Found APK: $APK"
          
          # Sprawdź czy jest unsigned
          if [[ "$APK" == *"-unsigned.apk" ]]; then
            echo "Processing unsigned APK..."
            
            # KROK 1: Najpierw zipalign
            echo "Step 1: Running zipalign..."
            $ZIPALIGN -v -p 4 "$APK" "${APK%.apk}-aligned.apk"
            
            # KROK 2: Potem podpisanie z wszystkimi wersjami sygnatury
            echo "Step 2: Signing with all signature schemes..."
            $APKSIGNER sign \
              --ks release-key.jks \
              --ks-key-alias androiddebugkey \
              --ks-pass pass:android \
              --key-pass pass:android \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --v4-signing-enabled false \
              --out "${APK/-unsigned.apk/-signed.apk}" \
              "${APK%.apk}-aligned.apk"
            
            # Usuń tymczasowy plik
            rm "${APK%.apk}-aligned.apk"
            
            FINAL_APK="${APK/-unsigned.apk/-signed.apk}"
            echo "Final APK: $FINAL_APK"
            
          else
            echo "APK is already signed, checking signature..."
            FINAL_APK="$APK"
          fi
          
          # KROK 3: Weryfikacja podpisu
          echo "Step 3: Verifying signature..."
          $APKSIGNER verify --verbose "$FINAL_APK"
          
          # Zapisz ścieżkę do użycia w następnych krokach
          echo "FINAL_APK_PATH=$FINAL_APK" >> $GITHUB_ENV
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: ${{ env.FINAL_APK_PATH }}
          
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.FINAL_APK_PATH }}
          tag_name: ${{ github.ref_name }}
          body: |
            🤖 Automatycznie wygenerowany release APK
            
            **Sygnatury:**
            - ✅ v1 (JAR signing)
            - ✅ v2 (APK Signature Scheme v2)
            - ✅ v3 (APK Signature Scheme v3)
            
            **Build info:**
            - Commit: ${{ github.sha }}
            - Tag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
